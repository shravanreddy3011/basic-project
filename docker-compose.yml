services:
  # Node.js Application

  api:
    build: 
      context: ./application
      dockerfile: Dockerfile

    container_name: employee_api

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: employee_db
      DB_USER: app_user
      DB_PASSWORD: dev_password_123

    depends_on:
      postgres:
        condition: service_healthy
  #PostgreSQL Database

  postgres:
    image: postgres:16-alpine
    container_name: employee_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password_123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d employee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
    