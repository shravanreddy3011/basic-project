name: Employee Management API 

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: dev_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d employee_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: application
    env: 
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: employee_db
      DB_USER: app_user
      DB_PASSWORD: dev_password_123
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install Dependencies
        run: npm ci

      - name: Verify database environment
        run: |
          node -e "
            for (const key of ['DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASSWORD']) {
              console.log(key + ': ' + (process.env[key] ? 'SET' : 'MISSING'));
            }
          "

      - name: Initialize Database Schema
        run: |
          node -e "
            const fs = require('fs');
            const { Pool } = require('pg');

          const pool = new Pool({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT),
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD
          });

          pool.query(fs.readFileSync('../database/init.sql', 'utf8'))
            .then(() => console.log('Database schema initialized'))
            .catch(err => {
              console.error(err);
              process.exitCode = 1;
            })
            .finally(() => pool.end());"
      
      - name: run automated tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push to Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: employee-management-api
          IMAGE_TAG: ${{ github.sha }}
        working-directory: application
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f Dockerfile.lambda \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$REPOSITORY:lambda-latest \
            .
          
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:lambda-latest
        
