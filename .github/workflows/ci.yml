name: Employee Management API 

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: dev_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d employee_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: application
    env: 
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: employee_db
      DB_USER: app_user
      DB_PASSWORD: dev_password_123
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install Dependencies
        run: npm ci

      - name: Initialize Database Schema
        run: |
          node -e "const fs = require('fs'); const { Pool } = require('pg'); const pool = new Pool(); pool.query(fs.readFileSync('../database/init.sql', 'utf8')).then(() => console.log('Database schema initialized')).catch(err => { console.error(err); process.exitCode = 1; }).finally(() => pool.end());"
      
      - name: run automated tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t employee-management-api:${{github.sha}} .
